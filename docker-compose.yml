services:
  api:
    build: .
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=taskapi;Username=postgres;Password=postgres
      RabbitMq__Uri: amqp://guest:guest@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskapi
    ports:
      - "55332:5432"   # порт нужен и интеграционному тесту (база taskapi_tests)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1: временный init-сервер слушает только unix-сокет
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 3s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"  # management UI, логин guest / guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
